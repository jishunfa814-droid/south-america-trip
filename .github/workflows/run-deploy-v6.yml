name: Run travel guide v6 deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[deploy-v6]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v6 index.html from split payload
        shell: bash
        run: |
          cat .deploy-v6-payload/part00 .deploy-v6-payload/part01 .deploy-v6-payload/part02 .deploy-v6-payload/part03 | base64 -d | gzip -d > index.html
          test "$(wc -c < index.html)" -eq 43970
      - name: Commit v6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[deploy-v6] Publish travel guide v6"
            git push
          fi
